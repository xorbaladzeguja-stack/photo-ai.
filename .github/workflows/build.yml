name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx cap add android || true
      - run: |
          python3 - << 'PY'
          import glob, re

          for path in glob.glob("android/app/src/main/res/values*/styles.xml"):
              with open(path, "r") as f:
                  s = f.read()
              if "windowOptOutEdgeToEdgeEnforcement" not in s:
                  s = s.replace(
                      "</style>",
                      '    <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>\n'
                      '    <item name="android:statusBarColor">#0B0D14</item>\n'
                      '    <item name="android:windowLightStatusBar">false</item>\n'
                      '    <item name="android:fitsSystemWindows">true</item>\n'
                      '    </style>'
                  )
                  with open(path, "w") as f:
                      f.write(s)

          for path in glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True):
              with open(path, "r") as f:
                  java = f.read()
              m = re.search(r"package\s+([\w.]+);", java)
              pkg = m.group(1) if m else "com.photoai.app"
              new_java = f"""package {pkg};

          import android.graphics.Color;
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0D14"));
              }}
          }}
          """
              with open(path, "w") as f:
                  f.write(new_java)
          PY
      - run: |
          if [ -f "assets/raw_logo" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
            python3 -c "from PIL import Image; Image.open('assets/raw_logo').convert('RGBA').resize((1024, 1024)).save('assets/icon.png', 'PNG')"
            rm -f assets/raw_logo
            npx -y @capacitor/assets generate --android
          fi
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: photo-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
